[tool.poetry]
name = "mcp-server"
version = "0.1.0"
description = ""
authors = ["Stony <stonyz@gmail.com>"]
readme = "README.md"
package-mode = false

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.6"
requests = "2.32.3"
sqlalchemy = "2.0.36"
cryptography = "42.0.5"
uvicorn = "^0.32.1"
sse-starlette = "^2.1.3"
httpx = "^0.28.1"
python-multipart = "^0.0.19"
passlib = "^1.7.4"
bcrypt = "^4.2.1"
pyjwt = "^2.10.1"
pydantic = "^2.10.4"
pydantic-settings = "^2.7.0"
pyyaml = "^6.0.2"
python-dotenv = "^1.0.1"
jsonschema = ">=4.23,<5"

[tool.poetry.scripts]
serve = "uvicorn:run"

[tool.uvicorn]
factory = false
reload = true

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
